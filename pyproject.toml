[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ui-design-studio-mcp"
version = "1.3.0"
description = "Local MCP adapter and authenticated dashboard for UI Design Studio"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.txt"]
dependencies = ["mcp==1.30.0", "segno>=1.6,<2", "psutil>=7,<8"]

[project.scripts]
ui-design-mcp = "ui_design_studio.cli:mcp_main"
ui-design = "ui_design_studio.cli:main"

[tool.hatch.build]
exclude = ["__pycache__", "*.pyc", "*.pyo", ".env", "credentials", ".ui-design-studio", ".design-server.json", ".design-status.json", ".design-owner.json", ".design-server.lock", ".design-records.lock", "node_modules", ".cache"]

[tool.hatch.build.targets.wheel]
only-include = ["src/ui_design_studio", ".omp/skills", ".omp/agents"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""
".omp" = "ui_design_studio/payload"

[tool.hatch.build.targets.sdist]
only-include = ["src", ".omp/skills", ".omp/agents", "pyproject.toml", "hatch_build.py", "README.md", "LICENSE.txt"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
